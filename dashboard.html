<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard RSVP — Alexandra & Anthony</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="dashboard-body">
<section id="loginScreen" class="login-screen"><div class="login-card"><p class="eyebrow">Alexandra & Anthony</p><h1>Dashboard privé</h1><p>Connectez-vous pour consulter les réponses.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="Adresse e-mail" autocomplete="email" required><input id="loginPassword" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button type="submit" class="primary-button">Se connecter</button><p id="loginStatus" class="form-status"></p></form></div></section>
<main id="dashboardApp" class="dashboard-shell hidden"><header class="dashboard-header"><div><p class="eyebrow">Alexandra & Anthony</p><h1>Dashboard des réponses</h1></div><div class="header-actions"><button id="refreshButton" class="secondary-button">Actualiser</button><button id="exportButton" class="primary-button">Exporter en CSV</button><button id="logoutButton" class="secondary-button">Se déconnecter</button></div></header><section class="stats-grid"><article class="stat-card"><span>Réponses</span><strong id="totalResponses">0</strong></article><article class="stat-card"><span>Oui</span><strong id="yesCount">0</strong></article><article class="stat-card"><span>Peut-être</span><strong id="maybeCount">0</strong></article><article class="stat-card"><span>Non</span><strong id="noCount">0</strong></article></section><section class="dashboard-panel"><div class="panel-toolbar"><input id="searchInput" type="search" placeholder="Rechercher un nom…"><select id="filterSelect"><option value="all">Toutes les réponses</option><option value="oui">Oui</option><option value="peut-être">Peut-être</option><option value="non">Non</option></select></div><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Présents</th><th>Réponse</th><th>Message</th><th>Date</th></tr></thead><tbody id="responsesBody"></tbody></table></div><p id="dashboardStatus" class="form-status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="dashboard.js"></script></body></html>
